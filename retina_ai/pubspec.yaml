name: retina_ai
description: RetinaAI — Diabetic Retinopathy Detection powered by AI.
publish_to: 'none'
version: 1.2.0+34

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  uuid: ^4.4.2
  intl: ^0.19.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/doctor_lab.jpg
    - assets/images/hero_biometric.jpg
    - assets/images/retina_sample_normal.jpg
    - assets/images/retina_sample_pathology.jpg
