# Ruff configuration snippet for Jupyter Notebooks
# Add this to your project's pyproject.toml or ruff.toml

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Per-file-ignores tailored specifically for Jupyter Notebooks
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "E402",  # Module level import not at top of file (common in exploratory cells)
    "F841",  # Local variable name assigned but never used
    "F401",  # Imported but unused (common when testing imports interactively)
    "B018",  # Found useless expression (common for trailing expressions to display values)
    "T201",  # print found (printing is standard in notebooks)
]

[tool.ruff.format]
quote-style = "double"
indent-width = 4
