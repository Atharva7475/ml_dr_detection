name: dr_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=11.8
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pillow
  - matplotlib
  - pyyaml
  - psutil
  - pip
  - pip:
      - timm
      - opencv-python-headless
      - albumentations
      - seaborn
      - tqdm
